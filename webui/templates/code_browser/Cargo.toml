[package]
name = "code_browser"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "build_index"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
clang-sys = "1.8.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
shell-words = "1.1.1"
walkdir = "2.5.0"
