worker_processes 1;
pid /run/nginx.pid;

events {
    # Omnigent require lots of resources
    worker_connections 128;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    client_max_body_size 1000M;
    add_header X-Powered-By "0RAYS-Codex-Client" always;

    auth_basic "Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    server {
        listen 8981;

        # codex-auditor webui
        location = /ui {
            return 302 /ui/;
        }

        location /ui/ {
            proxy_pass http://127.0.0.1:8983/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # Omnigent Codex mobile Web UI.  The trailing slash intentionally
        # strips /codex-ui/ before forwarding; Omnigent is configured with
        # the same base path and accepts this normal proxy form.
        location = /codex-ui {
            # don't jump to :8981
            absolute_redirect off;
            return 302 /codex-ui/;
        }

        location /codex-ui/ {
            proxy_pass http://127.0.0.1:6767/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 86400;
        }

        location = /dsh {
            absolute_redirect off;
            return 302 /dsh/;
        }

        location = /dsh/ {
            proxy_pass http://127.0.0.1:3080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # The published DSH Web UI disables Host-backed settings on every
            # non-loopback page. This reverse-proxied surface owns its Host,
            # so set DSH's shell transport marker before module scripts run.
            proxy_set_header Accept-Encoding "";
            sub_filter_once on;
            sub_filter '</head>' '<script>window.__DSH_TRANSPORT__={ownsHost:true}</script></head>';
            # Preserve the browser-visible authority for DSH Host/Origin and
            # cookie checks; $host would discard a non-default public port.
            proxy_set_header Host $http_host;
            # Nginx has already verified Basic Auth. DSH does not use it.
            proxy_set_header Authorization "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 86400;
            # The initial token is in this root request's query string. Do not
            # place it in the container Nginx access log.
            access_log off;
            proxy_intercept_errors on;
            # 401 means DSH needs its browser-session cookie; 502 means DSH
            # is not installed or has not finished starting yet.  Both cases
            # get an actionable response from /ui/dsh-launch.
            error_page 401 502 503 504 = /ui/dsh-launch;
        }

        location /dsh/ {
            proxy_pass http://127.0.0.1:3080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header Authorization "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 86400;
        }

        # DSH is not base-path aware: its HTML and browser code request these
        # root-absolute routes even when the entry page is mounted at /dsh/.
        location ~ ^/(?:assets|api|plugins)/ {
            proxy_pass http://127.0.0.1:3080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header Authorization "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 86400;
        }

        # ttyd
        location / {
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # filebrowser
        location = /files {
            absolute_redirect off;
            return 302 /files/;
        }

        location /files/ {
            proxy_pass http://127.0.0.1:8080/files/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
