name: Build Web Audit Image

on:
  push:
    branches:
      - web
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-web-audit-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          repository="${REPOSITORY,,}"
          echo "name=ghcr.io/${repository}-web" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=0RAYS Codex Auditor Web

      - name: Summarize result
        shell: bash
        run: |
          {
            echo "## Web image build"
            echo ""
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Image: \`${{ steps.image.outputs.name }}:latest\`"
            echo "- Immutable tag: \`${{ steps.image.outputs.name }}:sha-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
