worker_processes 1;
pid /run/nginx.pid;

events {
    # Omnigent require lots of resources
    worker_connections 128;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    client_max_body_size 1000M;
    add_header X-Powered-By "0RAYS-Codex-Client" always;

    auth_basic "Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    server {
        listen 8981;

        # codex-auditor webui
        location = /ui {
            return 302 /ui/;
        }

        location /ui/ {
            proxy_pass http://127.0.0.1:8983/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # Omnigent Codex mobile Web UI.  The trailing slash intentionally
        # strips /codex-ui/ before forwarding; Omnigent is configured with
        # the same base path and accepts this normal proxy form.
        location = /codex-ui {
            # don't jump to :8981
            absolute_redirect off;
            return 302 /codex-ui/;
        }

        location /codex-ui/ {
            proxy_pass http://127.0.0.1:6767/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 86400;
        }

        # ttyd
        location / {
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # filebrowser
        location /files/ {
            proxy_pass http://127.0.0.1:8080/files/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
